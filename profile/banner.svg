<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ShipIt — developer tools that do the work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D17"/>
      <stop offset="55%" stop-color="#141833"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#37E5B6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#37E5B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="1010" cy="150" rx="420" ry="260" fill="url(#glow)"/>

  <!-- mark: a chevron moving right, out of a rounded square -->
  <g transform="translate(88, 104)">
    <rect width="112" height="112" rx="30" fill="#7C5CFF"/>
    <circle cx="30" cy="56" r="6.5" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="48" cy="56" r="6.5" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M64 34 L88 56 L64 78" fill="none" stroke="#ffffff" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="236" y="146" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1.5">ShipIt</text>
    <text x="236" y="196" font-size="27" font-weight="500" fill="#B9C0DC">
      Developer tools that do the work, not just the talking.
    </text>
    <text x="236" y="240" font-size="19" font-weight="400" fill="#7C86AE">
      Coding agents · LLM observability · design systems · macOS
    </text>
  </g>

  <rect x="236" y="262" width="300" height="3" rx="1.5" fill="url(#fade)"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
